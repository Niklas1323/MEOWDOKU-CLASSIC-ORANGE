name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.MEOWDOKI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK (Google test ads)
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: meowdoki-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Store version (real ads), signed with the upload key from the repository secrets.
      # Without the secrets this step is skipped and only the test APK is built.
      - name: Build signed release (AAB for Google Play + APK)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          MEOWDOKI_KEYSTORE_BASE64: ${{ secrets.MEOWDOKI_KEYSTORE_BASE64 }}
          MEOWDOKI_KEYSTORE_PASSWORD: ${{ secrets.MEOWDOKI_KEYSTORE_PASSWORD }}
        run: |
          echo "$MEOWDOKI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export MEOWDOKI_KEYSTORE="$RUNNER_TEMP/upload.jks"
          gradle -p android bundleRelease assembleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          name: meowdoki-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Save the builds in the repo (apk/ and release/) for direct download
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/meowdoki-debug.apk
          git add apk/meowdoki-debug.apk
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            mkdir -p release
            cp android/app/build/outputs/bundle/release/app-release.aab release/meowdoki-release.aab
            cp android/app/build/outputs/apk/release/app-release.apk release/meowdoki-release.apk
            echo "versionCode ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}" > release/VERSION.txt
            git add release
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build meowdoki-debug.apk [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
